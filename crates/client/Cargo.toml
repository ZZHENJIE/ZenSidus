[package]
name = "client"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[[bin]]
name = "ZenSidus"
path = "src/main.rs"

[lib]
name = "client_lib"
path = "src/lib.rs"

[dependencies]
anyhow = { workspace = true }
chrono = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
anysdk = { workspace = true }

# relay 线协议 + 传输(TCP,可选 TLS;Nginx 终结 TLS 时客户端按固定证书校验)
relay-protocol = { path = "../relay-protocol" }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
webpki-roots = "0.26"
rustls-pemfile = "2"

tokio = { workspace = true }
http_client = { package = "gpui-pre-http-client", version = "=0.3.12" }
futures = { workspace = true }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
keyring = { version = "3", features = ["windows-native", "sync-secret-service"] }

reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.12" }
gpui-kit = { version = "0.9.1", features = ["gpui-fast"] }
rust-embed = { version = "8.13.0", features = ["debug-embed"] }
rust-i18n = "4.2.4"
directories = "6.0.0"
rodio = "0.23.0"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1.34"

    connection: 连接
    server_addr: 服务器地址
    server_addr_desc: 服务器地址,形如 host:port,如 server.example.com:9720。
    server_tls: TLS
    server_tls_desc: TLS 由服务器端的 nginx 终结;经其连接时保持开启。
    server_tls_cert: TLS 证书路径
